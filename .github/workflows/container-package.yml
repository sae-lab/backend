name: Backend CI and container package

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full commit SHA from the dev branch to publish as a GHCR candidate"
        required: true
        type: string

concurrency:
  group: backend-container-${{ github.workflow }}-${{ github.event.inputs.candidate_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    outputs:
      image_revision: ${{ steps.image_revision.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sightseeing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Validate candidate SHA format
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a lowercase, full 40-character commit SHA" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

      - name: Verify manual candidate is a dev commit
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail

          git rev-parse --verify "${CANDIDATE_SHA}^{commit}" >/dev/null
          actual_sha="$(git rev-parse --verify HEAD)"
          if [[ "${actual_sha}" != "${CANDIDATE_SHA}" ]]; then
            echo "Checked-out commit does not match candidate_sha" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor "${CANDIDATE_SHA}" refs/remotes/origin/dev; then
            echo "candidate_sha is not contained in the dev branch history" >&2
            exit 1
          fi

      - name: Resolve image revision
        id: image_revision
        run: echo "sha=$(git rev-parse --verify HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and package application
        run: ./gradlew --no-daemon clean test bootJar

      - name: Build container image
        run: docker build --tag sightseeing-backend-prod:test .

      - name: Start application container
        run: |
          set -euo pipefail

          JWT_SECRET="$(openssl rand -hex 64)"
          export JWT_SECRET
          echo "::add-mask::${JWT_SECRET}"

          docker run --detach \
            --name sightseeing-backend-smoke \
            --add-host host.docker.internal:host-gateway \
            --publish 8080:8080 \
            --env PORT=8080 \
            --env DB_URL=jdbc:postgresql://host.docker.internal:5432/sightseeing \
            --env DB_USERNAME=postgres \
            --env DB_PASSWORD=postgres \
            --env JWT_SECRET \
            --env API_TOKEN=ci-placeholder \
            --env TOUR_API_BASE_URL=https://apis.data.go.kr/B551011/KorService2 \
            --env ROUTE_API_BASE_URL=https://apis.data.go.kr/B551011/Durunubi \
            --env KAKAO_API_KEY=ci-placeholder \
            --env STORAGE_TYPE=local \
            --env APP_SEED_ENABLED=false \
            sightseeing-backend-prod:test

      - name: Wait for application readiness
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8080/readyz >/dev/null; then
              echo "Application readiness probe is UP"
              exit 0
            fi

            if ! docker inspect --format='{{.State.Running}}' sightseeing-backend-smoke 2>/dev/null | grep -q '^true$'; then
              echo "Application container exited before becoming ready" >&2
              docker logs sightseeing-backend-smoke >&2 || true
              exit 1
            fi

            sleep 1
          done

          echo "Application did not become ready within 60 seconds" >&2
          docker logs sightseeing-backend-smoke >&2 || true
          exit 1

      - name: Verify health endpoints
        run: bash scripts/verify-health-endpoints.sh http://127.0.0.1:8080 up

      - name: Show application logs on failure
        if: failure()
        run: docker logs sightseeing-backend-smoke || true

      - name: Stop application container
        if: always()
        run: docker rm --force sightseeing-backend-smoke || true

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && needs.validate.outputs.image_revision != '')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.image_revision }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prevent candidate image tag overwrite
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ghcr.io/sae-lab/backend
          IMAGE_REVISION: ${{ needs.validate.outputs.image_revision }}
        run: |
          set -euo pipefail

          if inspect_output="$(docker manifest inspect "${IMAGE}:${IMAGE_REVISION}" 2>&1)"; then
            echo "Candidate image tag already exists and will not be overwritten" >&2
            exit 1
          fi

          if [[ "${inspect_output}" != *"manifest unknown"* && "${inspect_output}" != *"no such manifest"* ]]; then
            echo "Unable to safely determine whether the candidate image tag exists" >&2
            echo "${inspect_output}" >&2
            exit 1
          fi

      - name: Build and publish immutable container image
        env:
          IMAGE: ghcr.io/sae-lab/backend
          IMAGE_REVISION: ${{ needs.validate.outputs.image_revision }}
        run: |
          set -euo pipefail

          build_args=(
            --label "org.opencontainers.image.revision=${IMAGE_REVISION}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --tag "${IMAGE}:${IMAGE_REVISION}"
          )
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            build_args+=(--tag "${IMAGE}:main")
          fi

          docker build "${build_args[@]}" .
          docker push "${IMAGE}:${IMAGE_REVISION}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker push "${IMAGE}:main"
          fi
