name: Backend CI and container package

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: backend-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sightseeing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and package application
        run: ./gradlew --no-daemon clean test bootJar

      - name: Build container image
        run: docker build --tag sightseeing-backend-prod:test .

      - name: Start application container
        run: |
          set -euo pipefail

          JWT_SECRET="$(openssl rand -hex 64)"
          export JWT_SECRET
          echo "::add-mask::${JWT_SECRET}"

          docker run --detach \
            --name sightseeing-backend-smoke \
            --add-host host.docker.internal:host-gateway \
            --publish 8080:8080 \
            --env PORT=8080 \
            --env DB_URL=jdbc:postgresql://host.docker.internal:5432/sightseeing \
            --env DB_USERNAME=postgres \
            --env DB_PASSWORD=postgres \
            --env JWT_SECRET \
            --env API_TOKEN=ci-placeholder \
            --env TOUR_API_BASE_URL=https://apis.data.go.kr/B551011/KorService2 \
            --env ROUTE_API_BASE_URL=https://apis.data.go.kr/B551011/Durunubi \
            --env KAKAO_API_KEY=ci-placeholder \
            --env STORAGE_TYPE=local \
            --env APP_SEED_ENABLED=false \
            sightseeing-backend-prod:test

      - name: Wait for application readiness
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8080/readyz >/dev/null; then
              echo "Application readiness probe is UP"
              exit 0
            fi

            if ! docker inspect --format='{{.State.Running}}' sightseeing-backend-smoke 2>/dev/null | grep -q '^true$'; then
              echo "Application container exited before becoming ready" >&2
              docker logs sightseeing-backend-smoke >&2 || true
              exit 1
            fi

            sleep 1
          done

          echo "Application did not become ready within 60 seconds" >&2
          docker logs sightseeing-backend-smoke >&2 || true
          exit 1

      - name: Verify health endpoints
        run: bash scripts/verify-health-endpoints.sh http://127.0.0.1:8080 up

      - name: Show application logs on failure
        if: failure()
        run: docker logs sightseeing-backend-smoke || true

      - name: Stop application container
        if: always()
        run: docker rm --force sightseeing-backend-smoke || true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable container image
        env:
          IMAGE: ghcr.io/sae-lab/backend
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:main" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:main"
