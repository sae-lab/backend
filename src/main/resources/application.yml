server:
  address: 0.0.0.0
  port: ${PORT:8080}

logging:
  level:
    com.se_lab.project: ${APP_LOG_LEVEL:INFO}

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:${IMAGE_MAX_FILE_SIZE:10MB}}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:${IMAGE_MAX_REQUEST_SIZE:12MB}}

  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

  # 비밀번호 재설정 코드 발송용 SMTP.
  # MAIL_HOST가 비어 있으면 발송 기능만 꺼지고 앱은 정상 부팅한다
  # (PasswordResetMailSender가 없을 수 있다고 보고 받는다).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: "${JWT_SECRET}"
  expiration_time: ${JWT_EXPIRATION_TIME:86400000}

tour-api:
  base-url: "${TOUR_API_BASE_URL}"
  service-key: "${API_TOKEN}"
  endpoints:
    location-based: "/locationBasedList2"
    area-based: "/areaBasedList2"
    search-keyword: "/searchKeyword2"
    detail-common: "/detailCommon2"

kakao:
  api-key: "${KAKAO_API_KEY}"

walking-course:
  base-url: "${ROUTE_API_BASE_URL}"
  service-key: "${WALKING_COURSE_SERVICE_KEY:${API_TOKEN}}"
  endpoints:
    course-list: "/courseList"

file:
  upload-dir: "${FILE_UPLOAD_DIR:./.local/uploads}"
  # 이전 기본 경로에 남아 있는 업로드 파일을 읽기 전용으로 제공한다.
  # 모든 기존 파일을 새 공통 루트로 옮긴 뒤 FILE_LEGACY_UPLOAD_DIR을 빈 값으로 설정할 수 있다.
  legacy-upload-dir: "${FILE_LEGACY_UPLOAD_DIR:./.local/uploads/user-routes}"

storage:
  type: "${STORAGE_TYPE:local}"
  r2:
    endpoint: "${R2_ENDPOINT:}"
    bucket: "${R2_BUCKET:}"
    access-key-id: "${R2_ACCESS_KEY_ID:}"
    secret-access-key: "${R2_SECRET_ACCESS_KEY:}"
    public-base-url: "${R2_PUBLIC_BASE_URL:}"
    object-prefix: "${R2_OBJECT_PREFIX:dev}"

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}"
  image-proxy:
    allowed-hosts: "${IMAGE_PROXY_ALLOWED_HOSTS:tong.visitkorea.or.kr}"
  password-reset:
    # 보내는 사람 주소. 비워두면 MAIL_USERNAME을 그대로 쓴다.
    mail-from: "${MAIL_FROM:}"
