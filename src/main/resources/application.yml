server:
  address: 0.0.0.0
  port: ${PORT:8080}

logging:
  level:
    com.se_lab.project: ${APP_LOG_LEVEL:INFO}

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:${IMAGE_MAX_FILE_SIZE:10MB}}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:${IMAGE_MAX_REQUEST_SIZE:12MB}}

  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

  # 비밀번호 재설정 코드 발송용 SMTP.
  # MAIL_HOST가 비어 있으면 발송 기능만 꺼지고 앱은 정상 부팅한다
  # (PasswordResetMailSender가 없을 수 있다고 보고 받는다).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # 587(STARTTLS)과 465(암묵적 SSL) 중 하나를 고른다.
          # 호스팅에서 587 아웃바운드를 막아둔 경우 465로 우회할 수 있어
          # 환경변수만 바꿔 시도해볼 수 있게 열어둔다.
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          # 막힌 포트로 붙으면 응답 없이 대기하므로, 사용자를 오래 기다리게
          # 두지 않도록 짧게 끊는다.
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}

jwt:
  secret: "${JWT_SECRET}"
  expiration_time: ${JWT_EXPIRATION_TIME:86400000}

tour-api:
  base-url: "${TOUR_API_BASE_URL}"
  service-key: "${API_TOKEN}"
  endpoints:
    location-based: "/locationBasedList2"
    area-based: "/areaBasedList2"
    search-keyword: "/searchKeyword2"
    detail-common: "/detailCommon2"

kakao:
  api-key: "${KAKAO_API_KEY}"

walking-course:
  base-url: "${ROUTE_API_BASE_URL}"
  service-key: "${WALKING_COURSE_SERVICE_KEY:${API_TOKEN}}"
  endpoints:
    course-list: "/courseList"

file:
  upload-dir: "${FILE_UPLOAD_DIR:./.local/uploads}"
  # 이전 기본 경로에 남아 있는 업로드 파일을 읽기 전용으로 제공한다.
  # 모든 기존 파일을 새 공통 루트로 옮긴 뒤 FILE_LEGACY_UPLOAD_DIR을 빈 값으로 설정할 수 있다.
  legacy-upload-dir: "${FILE_LEGACY_UPLOAD_DIR:./.local/uploads/user-routes}"

storage:
  type: "${STORAGE_TYPE:local}"
  r2:
    endpoint: "${R2_ENDPOINT:}"
    bucket: "${R2_BUCKET:}"
    access-key-id: "${R2_ACCESS_KEY_ID:}"
    secret-access-key: "${R2_SECRET_ACCESS_KEY:}"
    public-base-url: "${R2_PUBLIC_BASE_URL:}"
    object-prefix: "${R2_OBJECT_PREFIX:dev}"

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}"
  image-proxy:
    allowed-hosts: "${IMAGE_PROXY_ALLOWED_HOSTS:tong.visitkorea.or.kr}"
  password-reset:
    # smtp | brevo
    # Render 등 호스팅은 스팸 방지로 SMTP 아웃바운드 포트(25/587/465)를 막아둬서
    # SMTP로는 연결 자체가 안 된다. 배포 환경에서는 HTTPS(443)를 쓰는 brevo로 둔다.
    provider: "${MAIL_PROVIDER:smtp}"
    # 보내는 사람 주소. 비워두면 MAIL_USERNAME을 그대로 쓴다.
    # brevo에서는 이 주소가 발신자로 인증돼 있어야 한다.
    mail-from: "${MAIL_FROM:}"
    brevo-api-key: "${BREVO_API_KEY:}"
